
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b46">

  <title>Sign In | CSRS - RP Musanze College</title>

  <meta
    name="description"
    content="Secure sign-in portal for the Campus Security and Reporting System at RP Musanze College."
  >

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #172b43;
      --muted: #64748b;
      --border: #dbe3ec;
      --accent: #1769aa;
      --accent-hover: #10558c;
      --input-bg: #ffffff;
      --focus: rgba(23, 105, 170, 0.18);
      --error: #b42318;
      --success: #15803d;
      --shadow: 0 24px 70px rgba(16, 43, 70, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0b1521;
        --card: #142235;
        --text: #edf4fc;
        --muted: #a2b2c7;
        --border: #304258;
        --accent: #4a9be0;
        --accent-hover: #68afea;
        --input-bg: #101d2d;
        --focus: rgba(74, 155, 224, 0.2);
        --error: #ff9a91;
        --success: #86efac;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(48, 126, 192, 0.12),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(20, 92, 151, 0.10),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: var(--accent);
      color: #fff;
    }

    .brand-icon svg {
      width: 31px;
      height: 31px;
    }

    .brand-name {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand-caption {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2rem);
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 10px 0 26px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .field {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.88rem;
      font-weight: 650;
    }

    .input-wrap {
      position: relative;
    }

    input {
      display: block;
      width: 100%;
      min-height: 49px;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      font: inherit;
      font-size: 0.94rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--focus);
    }

    #p {
      padding-right: 76px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      padding: 5px;
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .password-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .sign-in {
      width: 100%;
      min-height: 50px;
      margin-top: 5px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .sign-in:hover {
      background: var(--accent-hover);
    }

    .sign-in:active {
      transform: scale(0.99);
    }

    .sign-in:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .sign-in:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #msg {
      min-height: 1.5em;
      margin-top: 15px;
      font-size: 0.88rem;
      overflow-wrap: anywhere;
    }

    #msg.err {
      color: var(--error);
    }

    #msg.success {
      color: var(--success);
    }

    .security-note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 24px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .security-note svg {
      flex: 0 0 18px;
      margin-top: 2px;
    }

    footer {
      margin-top: 27px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    footer p {
      margin: 4px 0;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 26px 21px;
        border-radius: 16px;
      }

      .brand {
        margin-bottom: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>

      <div>
        <p class="brand-name">CSRS</p>
        <p class="brand-caption">RP Musanze College</p>
      </div>
    </header>

    <section>
      <p class="eyebrow">Secure access portal</p>
      <h1>Welcome back</h1>
      <p class="subtitle">
        Sign in to access the Campus Security and Reporting System.
      </p>

      <form id="login">
        <div class="field">
          <label for="u">Username or email</label>
          <input
            id="u"
            name="username"
            type="text"
            placeholder="Enter your username or email"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
        </div>

        <div class="field">
          <label for="p">Password</label>
          <div class="input-wrap">
            <input
              id="p"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              class="password-toggle"
              id="togglePassword"
              type="button"
              aria-controls="p"
              aria-pressed="false"
            >
              Show
            </button>
          </div>
        </div>

        <button class="sign-in" id="submitBtn" type="submit">
          Sign in
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
      </form>

      <div id="msg" role="status" aria-live="polite"></div>

      <div class="security-note">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="4" y="10" width="16" height="11" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          <path d="M12 14v3"/>
        </svg>
        <span>
          This portal is intended for authorized users.
          Keep your login credentials confidential.
        </span>
      </div>
    </section>

    <footer>
      <p>Campus Security and Reporting System</p>
      <p>&copy; <span id="year"></span> RP Musanze College</p>
    </footer>
  </main>

  <script>
    // Password visibility control.
    const passwordInput = document.getElementById("p");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "Hide" : "Show";
      togglePassword.setAttribute("aria-pressed", String(isPassword));
    });

    // Automatically update the copyright year.
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

  <script src="/login.js"></script>
</body>
</html>
