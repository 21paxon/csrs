<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Purpose: Page markup and controls for the index workflow. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b63">

  <title>CSRS | Rwanda Polytechnic Musanze College</title>

  <link rel="stylesheet" href="/css/theme.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #243447;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 40px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid #e0e6ed;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(18, 59, 99, 0.08);
    }

    .logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .institution {
      margin: 0;
      color: #123b63;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .college {
      margin: 6px 0 28px;
      color: #64748b;
      font-size: 0.95rem;
    }

    h1 {
      margin-bottom: 12px;
      color: #123b63;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
    }

    .description {
      max-width: 480px;
      margin: 0 auto 28px;
      color: #64748b;
      line-height: 1.7;
    }

    .home-link {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 8px;
      background: #123b63;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }

    .home-link:hover {
      background: #1c527f;
    }

    footer {
      margin-top: 32px;
      color: #64748b;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <main class="container">
    <img
      class="logo"
      src="/images/rp-logo.jpg"
      alt="Rwanda Polytechnic logo"
    >

    <p class="institution">Rwanda Polytechnic</p>
    <p class="college">Musanze College</p>

    <h1>Campus Security and Reporting System</h1>

    <p class="description">
      A centralized system for campus security reporting,
      incident management, and campus safety information.
    </p>

    <a class="home-link" href="/home.html">
      Open CSRS Home
    </a>

    <footer>
      <p>&copy; <span id="year"></span> Rwanda Polytechnic — Musanze College</p>
      <p>Campus Security and Reporting System</p>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
