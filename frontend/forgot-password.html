<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b70">
  <title>Reset password | CSRS</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <header class="app-top"><div class="app-top-inner"><a href="/home.html">CSRS · Rwanda Polytechnic, Musanze College</a></div></header>
  <main class="app-main">
    <section class="panel">
      <h1>Forgot your password?</h1>
      <p>Enter your registered email, username or registration number. If the account is active, we will send a one-time reset link.</p>
      <form id="forgotPasswordForm">
        <label for="identifier">Email, username or registration number</label>
        <input id="identifier" autocomplete="username" required maxlength="120">
        <button type="submit" id="sendResetLink">Send reset link</button>
      </form>
      <p id="resetMessage" class="message" role="status"></p>
      <a href="/home.html?signin=1">Return to sign in</a>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="/js/csrs.js"></script>
  <script src="/forgot-password.js" defer></script>
  <script src="/pwa.js" defer></script>
</body>
</html>
