<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14243a">
  <title>Change Password | CSRS</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <main class="page-shell" style="max-width: 620px; margin: 0 auto; padding: 32px 20px;">
    <section class="panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Account security</p>
          <h1>Change your password</h1>
        </div>
        <a class="button button-secondary" href="/home.html">Home</a>
      </div>

      <p class="muted">
        Use a password of 12 to 128 characters. If an administrator issued you
        a temporary password, you must replace it before continuing.
      </p>

      <form id="passwordForm" class="stack">
        <label>
          Current password
          <input id="currentPassword" type="password" autocomplete="current-password" required>
        </label>
        <label>
          New password
          <input id="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
        </label>
        <label>
          Confirm new password
          <input id="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
        </label>
        <button class="button button-primary" type="submit" id="savePassword">Update password</button>
        <p id="message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="/js/csrs.js"></script>
  <script src="/change-password.js" defer></script>
  <script src="/pwa.js" defer></script>
</body>
</html>
