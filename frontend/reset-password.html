<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b70">
  <title>Choose a new password | CSRS</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <header class="app-top"><div class="app-top-inner"><a href="/home.html">CSRS · Rwanda Polytechnic, Musanze College</a></div></header>
  <main class="app-main">
    <section class="panel">
      <h1>Choose a new password</h1>
      <p>Use a password with at least 12 characters. The reset link can be used once and expires after one hour.</p>
      <form id="resetPasswordForm">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
        <button type="submit" id="saveNewPassword">Save new password</button>
      </form>
      <p id="resetMessage" class="message" role="status"></p>
      <a href="/home.html?signin=1">Return to sign in</a>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="/js/csrs.js"></script>
  <script src="/reset-password.js" defer></script>
  <script src="/pwa.js" defer></script>
</body>
</html>
